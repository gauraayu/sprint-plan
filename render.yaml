# Render blueprint for the API. Database can be Render, Neon, Supabase or Railway PostgreSQL.
services:
  - type: web
    name: teaching-portal-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
      # Never list the demo accounts on a real deployment (production ignores it anyway).
      - key: DEMO_AUTH_ENABLED
        value: "false"
